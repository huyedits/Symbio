[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name, not the command. `symbio` was taken on
# 2026-06-08 by an unrelated multi-agent framework (github.com/854875058/
# Symbio) — forty days before this project went public — and `symb` by a
# symbol-system library in 2025. Both fairly, and neither is going away.
# The installed commands are unaffected: [project.scripts] below still
# provides `symbio` and `symb`.
name = "symbio-cli"
# 0.1.0 was published and is unusable: symbio/agent.py imported a top-level
# `planner` module that the distribution never contained, so `symb --help`
# raised ModuleNotFoundError on any clean install. Versions cannot be reused on
# PyPI, so the fix ships as 0.1.1.
version = "0.1.2"
description = "Personal, autonomous, self-finetuning local MLX agent."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Huy Tran", email = "MUSTARDMANGOSMANGOS@proton.me" }]
keywords = ["llm", "agent", "lora", "fine-tuning", "mlx", "apple-silicon", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

# The inference and training engine is NOT a hard dependency, because it cannot
# be installed everywhere: `mlx` publishes macOS-arm64 wheels and no sdist at
# all, so a hard requirement makes `pip install symbio-cli` fail during
# resolution on Linux and Windows — before the user ever sees a message
# explaining why. That matters more since linuxcommandlibrary.com/man/symbio
# started sending Linux users here.
#
# It also used to be inverted: `mlx` sat in an optional extra while `mlx-lm`,
# which depends on it, was required — so the extra could never actually be
# opted out of. Both live together in the `mlx` extra now, both marked darwin.
dependencies = [
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "playwright>=1.45.0",
    "PyAutoGUI>=0.9.54",
    "Pillow>=10.0.0",
    "python-telegram-bot>=20.0",
    "fastmcp>=2.2.0",
    "httpx>=0.27",
    "anthropic>=0.49",
    "pydantic-settings>=2.0",
    "jsonschema>=4.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.urls]
Homepage = "https://github.com/huyedits/Symbio"
Repository = "https://github.com/huyedits/Symbio"
Issues = "https://github.com/huyedits/Symbio/issues"
Demo = "https://huggingface.co/spaces/HuyEdits/symbio-demo"

[project.scripts]
symbio = "symbio.app.cli:main"
symb = "symbio.app.cli:main"
symbio-desktop = "symbio_desktop.cli:main"

[project.optional-dependencies]
# The default install on an Apple Silicon Mac: `pip install "symbio-cli[mlx]"`.
mlx = [
    "mlx-lm>=0.21.0; sys_platform == 'darwin'",
    "mlx>=0.30.0; sys_platform == 'darwin'",
    "torch; sys_platform == 'darwin'",
]
# Kept as an alias so existing `[native]` instructions do not break.
native = [
    "symbio-cli[mlx]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# No py-modules. `rag.py` and `computer.py` used to sit at the repository root
# and were shipped as TOP-LEVEL modules, so installing this dropped files named
# `rag.py` and `computer.py` straight into site-packages, where they could
# shadow or be shadowed by anything else claiming those very generic names.
# `rag` moved to `symbio/rag.py`; the root `computer.py` was a stale duplicate
# of `symbio/computer.py` (half the size, months behind) that nothing imported.

[tool.setuptools.packages.find]
include = ["symbio*"]

[tool.pytest.ini_options]
# Only test_*.py, NOT pytest's default "*_test.py" as well.
#
# db_agent_test.py matches that second pattern, and it is not a test — it is a
# standalone experiment that hot-swaps modules out of a git worktree:
#     swap("symbio.app.tooling", WT + "/symbio/app/tooling.py")
# at module scope. pytest imports a matching file just to look for tests
# ("no tests collected"), and the swap runs on import, so for the rest of the
# session symbio.app.tooling IS the worktree's stale copy — while sys.path is
# clean and symbio itself resolves correctly, which is what makes it so hard to
# see. Measured 2026-08-25: six failures across test_security_policy,
# test_streaming, test_chat_stress and test_tool_call_repair, every one of them
# passing in isolation and failing in the full run.
python_files = ["test_*.py"]
norecursedirs = [".git", ".claude", "venv", "adapters*", "spaces"]
