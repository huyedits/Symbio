<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbio</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-top">
    <button class="icon-btn" id="btn-collapse" title="Hide sidebar" aria-label="Hide sidebar">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" fill="none" stroke-width="1.3"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="new-chat" id="btn-new-chat">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New chat
    </button>
  </div>

  <div class="sidebar-section recents">
    <div class="sidebar-label">Recents</div>
    <div id="chat-list" class="chat-list"></div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">Workspace</div>
    <button class="side-item" data-open-view="mindmap">Adapter map</button>
    <button class="side-item" data-open-view="skills">Skills</button>
    <button class="side-item" data-open-view="rag">RAG corpus</button>
    <button class="side-item" data-open-view="health">Health</button>
  </div>

  <div class="sidebar-foot">
    <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting…</span></div>
    <button class="icon-btn" id="btn-theme" title="Light or dark" aria-label="Toggle theme">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="2.4" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
  </div>
</aside>

<main id="main">
  <header id="topbar">
    <button class="icon-btn" id="btn-show-sidebar" title="Show sidebar" aria-label="Show sidebar">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" fill="none" stroke-width="1.3"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <div class="topbar-title" id="conversation-title">New chat</div>
    <div class="topbar-right"></div>
  </header>

  <div id="thread" class="thread">
    <div class="welcome" id="welcome">
      <h1 class="greeting"><span class="mark" aria-hidden="true"></span><span id="welcome-title">Symbio</span></h1>
    </div>
  </div>

  <button class="to-bottom" id="btn-to-bottom" type="button" aria-label="Scroll to the latest message" hidden>
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  </button>

  <div class="composer-wrap">
    <div class="notice" id="notice" hidden>
      <span class="notice-text" id="notice-text"></span>
      <button class="icon-btn" id="btn-notice-close" type="button" aria-label="Dismiss">✕</button>
    </div>
    <div class="read-only-banner" id="read-only-banner" hidden>
      Reading a saved transcript. <button class="link-btn" id="btn-back-live">Back to the live chat</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="How can I help you today?" autofocus></textarea>
      <div class="composer-bar">
        <span class="composer-note">Runs on this Mac</span>
        <span class="chip model-chip" id="model-chip" title="The resident model">—</span>
        <button type="submit" id="btn-send" disabled aria-label="Send">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </form>
    <div class="suggestions" id="suggestions">
      <button class="suggestion" data-send="What do you know about me?">What do you know about me?</button>
      <button class="suggestion" data-send="Look at my screen and tell me what's in front.">Look at my screen</button>
      <button class="suggestion" data-send="What skills have you trained adapters for?">My trained skills</button>
    </div>
  </div>
</main>

<section id="workspace">
  <header class="ws-head">
    <nav class="ws-tabs">
      <button class="ws-tab active" data-view="mindmap">Adapter map</button>
      <button class="ws-tab" data-view="skills">Skills</button>
      <button class="ws-tab" data-view="rag">RAG corpus</button>
      <button class="ws-tab" data-view="health">Health</button>
      <button class="ws-tab" data-view="sessions">Sessions</button>
    </nav>
    <div class="ws-actions">
      <button class="icon-btn" id="btn-zoom-out" title="Zoom out">−</button>
      <button class="icon-btn" id="btn-zoom-in" title="Zoom in">+</button>
      <button class="icon-btn" id="btn-zoom-fit" title="Fit">⊡</button>
      <button class="icon-btn" id="btn-refresh" title="Refresh">↻</button>
      <button class="icon-btn" id="btn-layout" title="Move this panel: right, left, below">⇄</button>
      <button class="icon-btn" id="btn-swap" title="Swap the chat and this panel">⇆</button>
      <button class="icon-btn" id="btn-close-workspace" title="Close" aria-label="Close workspace">✕</button>
    </div>
  </header>

  <section id="view-mindmap" class="view active">
    <div class="mindmap-container" id="mindmap">
      <div class="mindmap-legend">
        <span class="legend-item"><span class="legend-dot headmaster"></span> Headmaster</span>
        <span class="legend-item"><span class="legend-dot worker"></span> Workers</span>
        <span class="legend-item"><span class="legend-dot skill"></span> Skills</span>
        <span class="legend-item"><span class="legend-dot rag"></span> RAG</span>
        <span class="legend-item"><span class="legend-dot training"></span> Training</span>
      </div>
      <svg id="mindmap-svg"></svg>
    </div>
    <div class="detail-panel hidden" id="detail-panel">
      <div class="detail-placeholder">Click a node for details</div>
    </div>
  </section>

  <section id="view-skills" class="view">
    <div class="view-header"><h1>Skill adapters</h1><span class="count-badge" id="skill-count">0</span></div>
    <div class="skills-grid" id="skills-grid"></div>
  </section>

  <section id="view-rag" class="view">
    <div class="view-header"><h1>RAG corpus</h1></div>
    <div class="rag-stats" id="rag-stats"></div>
  </section>

  <section id="view-sessions" class="view">
    <div class="view-header"><h1>Sessions</h1><span class="count-badge" id="session-count">0</span></div>
    <div class="sessions-split">
      <div class="session-list" id="session-list"></div>
      <div class="session-detail" id="session-detail"><div class="detail-placeholder">Pick a session to read it</div></div>
    </div>
  </section>

  <section id="view-health" class="view">
    <div class="view-header"><h1>System health</h1></div>
    <div class="health-content" id="health-content"></div>
  </section>
</section>

<div id="scrim"></div>

<section id="settings" hidden>
  <div class="settings-panel" role="dialog" aria-label="Settings">
    <header class="settings-head">
      <h2>Settings</h2>
      <button class="icon-btn" id="btn-close-settings" aria-label="Close settings">✕</button>
    </header>
    <div class="settings-body" id="settings-body"></div>
  </div>
</section>

<script src="/static/chat.js"></script>
<script src="/static/workspace.js"></script>
<script src="/static/settings.js"></script>
</body>
</html>
