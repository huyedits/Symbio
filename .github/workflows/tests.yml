name: tests

# The suite runs off-Mac: tests that need the MLX engine (Apple Silicon only)
# report as skips there, via tests/conftest.py, and everything else — the
# agent loop with a faked model, the safety gates, the sandbox, the browser
# against a local form — runs for real.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Test
        # xvfb: the browser tests launch a headed Chromium, as the agent does.
        run: xvfb-run -a python -m pytest -q
